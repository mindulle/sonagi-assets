apiVersion: batch/v1
kind: CronJob
metadata:
  name: sonagi-assets-sync
  namespace: default
spec:
  schedule: "0 * * * *" # Every hour
  concurrencyPolicy: Replace
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: sync
            image: ghcr.io/mindulle/sonagi-assets:1.16.2
            imagePullPolicy: Always
            command: ["python", "build_asset_hub.py"]
            volumeMounts:
            - name: db-volume
              mountPath: /app/asset_hub.db
            - name: library-volume
              mountPath: /mnt/monitoring/@GP66_D드라이브 백업/my-eagle/Design.library
            - name: ai-assets-volume
              mountPath: /mnt/monitoring/ai-assets
          restartPolicy: OnFailure
          volumes:
          - name: db-volume
            hostPath:
              path: /home/mindulle/design-tools-setup/asset_hub.db
              type: FileOrCreate
          - name: library-volume
            hostPath:
              path: /mnt/monitoring/@GP66_D드라이브 백업/my-eagle/Design.library
              type: Directory
          - name: ai-assets-volume
            hostPath:
              path: /mnt/monitoring/ai-assets
              type: DirectoryOrCreate
