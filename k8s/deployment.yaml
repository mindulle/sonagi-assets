apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonagi-assets-web
  namespace: default
  labels:
    app: sonagi-assets-web
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sonagi-assets-web
  template:
    metadata:
      labels:
        app: sonagi-assets-web
    spec:
      containers:
      - name: web
        image: ghcr.io/mindulle/sonagi-assets:1.10.0
        imagePullPolicy: Always
        env:
        - name: GALLERY_LIBRARY_PATH
          value: "/app/data/Design.library/images"
        ports:
        - containerPort: 34920
          hostPort: 34920
        volumeMounts:
        - name: db-volume
          mountPath: /app/asset_hub.db
        - name: library-volume
          mountPath: /app/data
      volumes:
      - name: db-volume
        hostPath:
          path: /home/mindulle/design-tools-setup/asset_hub.db
          type: FileOrCreate
      - name: library-volume
        persistentVolumeClaim:
          claimName: sonagi-gallery-library-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: sonagi-assets-svc
  namespace: default
spec:
  selector:
    app: sonagi-assets-web
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 34920
      targetPort: 34920
