<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonagi Asset Hub</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .action-btns { margin-top: 15px; display: flex; gap: 10px; }
        .danger-btn { background: #ff4757; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; }
        .edit-btn { background: #2ed573; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; }
        .tag-input { padding: 4px; border: 1px solid #ccc; border-radius: 4px; width: 100%; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Sonagi Asset Hub</h2>
            </div>

            <div class="sidebar-section">
                <h3>Extensions</h3>
                <ul id="ext-list" class="filter-list">
                    <li class="loading-text">Loading...</li>
                </ul>
            </div>

            <div class="sidebar-section">
                <h3>Popular Tags</h3>
                <ul id="tag-list" class="filter-list">
                    <li class="loading-text">Loading...</li>
                </ul>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="header">
                <input type="text" id="search" placeholder="Search tags, names, or extensions (e.g. png)..." onkeyup="if(event.key==='Enter') searchItems()">
                <button type="button" onclick="searchItems()">Search</button>
            </div>

            <!-- Simple Upload Area -->
            <div class="header" style="margin-top: 10px; background: #f1f2f6; padding: 15px; border-radius: 8px;">
                <h4>Quick Upload</h4>
                <input type="file" id="file-upload">
                <input type="text" id="upload-tags" placeholder="Tags (comma separated)">
                <button type="button" onclick="uploadAsset()">Upload</button>
            </div>

            <div id="stats" class="stats"></div>

            <div class="gallery" id="gallery"></div>

            <div id="loading" class="loading-container">
                <div class="spinner"></div>
                <span>Loading...</span>
            </div>
        </main>
    </div>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox">
        <div class="lightbox-overlay" onclick="closeModal()"></div>
        <div class="lightbox-content">
            <button type="button" class="close-btn" onclick="closeModal()">&times;</button>
            <div class="lightbox-image-container">
                <div id="modal-img-wrapper"><img id="modal-img" src="" alt="Preview"></div>
            </div>
            <div class="lightbox-info">
                <h2 id="modal-title"></h2>
                <div class="modal-meta">
                    <p><strong>Extension:</strong> <span id="modal-ext"></span></p>
                    <p><strong>Date:</strong> <span id="modal-date"></span></p>
                    <p><strong>Source:</strong> <a id="modal-url" href="#" target="_blank" rel="noopener noreferrer"></a></p>
                </div>

                <div id="edit-mode" style="display: none; margin-bottom: 15px;">
                    <input type="text" id="edit-name" class="tag-input" placeholder="Name">
                    <input type="text" id="edit-tags" class="tag-input" placeholder="Tags (comma separated)">
                    <button type="button" class="edit-btn" style="margin-top: 5px;" onclick="saveEdits()">Save</button>
                    <button type="button" class="close-btn" style="position: static; font-size: 14px; padding: 5px;" onclick="toggleEditMode(false)">Cancel</button>
                </div>

                <div class="modal-tags" id="modal-tags"></div>
                <div class="action-btns">
                    <a id="modal-original-link" href="#" target="_blank" class="download-btn">View Original</a>
                    <button type="button" class="edit-btn" onclick="toggleEditMode(true)">Edit</button>
                    <button type="button" class="danger-btn" onclick="deleteAsset()">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/main.js"></script>
</body>
</html>
